<!doctype html>
{% set recruiter_area = true %}
{% set path = request.url.path %}
<html lang="en"><head>
<title>{% block title %}Workspace{% endblock %} · {{ company }} Recruiting</title>
{% include "_head.html" %}
</head><body>
<div class="shell">
<aside class="side">
  <a class="brand" href="/recruiter" aria-label="{{ company }} recruiting"><img src="/brand/logo.svg" alt="{{ company }}" height="24"></a>
  <div class="sec">Hiring</div>
  <a class="nav {{ 'on' if path == '/recruiter' or '/jobs' in path or '/applications' in path }}" href="/recruiter">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="3"/><path d="M9 7V5.5A1.5 1.5 0 0 1 10.5 4h3A1.5 1.5 0 0 1 15 5.5V7"/></svg>Jobs</a>
  <a class="nav {{ 'on' if '/audit' in path }}" href="/recruiter/audit">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8v4l3 2"/><circle cx="12" cy="12" r="9"/></svg>Audit log</a>
  <div class="sec">Public</div>
  <a class="nav" href="/" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-9 9"/><path d="M18 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4"/></svg>Careers site</a>
  <span class="sp"></span>
  <div class="me"><span>{{ request.session.get('user') }}</span><a class="btn sm ghost" href="/recruiter/logout">Sign out</a></div>
</aside>
<main class="main">{% block content %}{% endblock %}</main>
</div>
</body></html>
